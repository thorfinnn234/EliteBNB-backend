}spring.datasource.url=jdbc:h2:mem:elitebnb_test;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

paystack.secret-key=${PAYSTACK_SECRET_KEY:test-paystack-secret-key}
paystack.base-url=https://api.paystack.co

spring.mail.host=localhost
spring.mail.port=2525
spring.mail.username=${MAIL_USERNAME:test@example.com}
spring.mail.password=${MAIL_PASSWORD:test-mail-password}
spring.mail.properties.mail.smtp.auth=false
spring.mail.properties.mail.smtp.ssl.enable=false

brevo.api.key=${BREVO_API_KEY:test-brevo-api-key}
brevo.api.url=https://api.brevo.com/v3/smtp/email

cloudinary.cloud-name=${CLOUDINARY_CLOUD_NAME:test-cloud-name}
cloudinary.api-key=${CLOUDINARY_API_KEY:test-cloudinary-api-key}
cloudinary.api-secret=${CLOUDINARY_API_SECRET:test-cloudinary-api-secret}

spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID:test-google-client-id}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET:test-google-client-secret}
spring.security.oauth2.client.registration.google.scope=openid,profile,email

ELITEBNB_ADMIN_BOOTSTRAP_ENABLED=false
management.health.mail.enabled=false