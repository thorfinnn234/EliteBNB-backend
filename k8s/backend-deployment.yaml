apiVersion: apps/v1
kind: Deployment
metadata:
  name: elitebnb-backend
  namespace: elitebnb
  labels:
    app.kubernetes.io/name: elitebnb-backend
    app.kubernetes.io/part-of: elitebnb

spec:
  replicas: 1

  selector:
    matchLabels:
      app.kubernetes.io/name: elitebnb-backend

  template:
    metadata:
      labels:
        app.kubernetes.io/name: elitebnb-backend
        app.kubernetes.io/part-of: elitebnb

      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/path: "/actuator/prometheus"
        prometheus.io/port: "8086"

    spec:
      containers:
        - name: backend
          image: elitebnb-backend:latest
          imagePullPolicy: IfNotPresent

          ports:
            - name: http
              containerPort: 8086

          envFrom:
            - configMapRef:
                name: elitebnb-backend-config

            - secretRef:
                name: elitebnb-backend-secret

          startupProbe:
            httpGet:
              path: /actuator/health
              port: http
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 30

          readinessProbe:
            httpGet:
              path: /actuator/health
              port: http
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 6

          livenessProbe:
            httpGet:
              path: /actuator/health
              port: http
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 6

          resources:
            requests:
              cpu: 250m
              memory: 512Mi

            limits:
              cpu: "1"
              memory: 1Gi