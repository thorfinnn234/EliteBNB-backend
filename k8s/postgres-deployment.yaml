apiVersion: apps/v1
kind: Deployment
metadata:
  name: elitebnb-postgres
  namespace: elitebnb
  labels:
    app.kubernetes.io/name: elitebnb-postgres
    app.kubernetes.io/part-of: elitebnb
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: elitebnb-postgres
  template:
    metadata:
      labels:
        app.kubernetes.io/name: elitebnb-postgres
        app.kubernetes.io/part-of: elitebnb
    spec:
      containers:
        - name: postgres
          image: postgres:17
          imagePullPolicy: IfNotPresent
          ports:
            - name: postgres
              containerPort: 5432
          env:
            - name: POSTGRES_DB
              value: elitebnb
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: elitebnb-backend-secret
                  key: DB_USERNAME
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: elitebnb-backend-secret
                  key: DB_PASSWORD
          readinessProbe:
            exec:
              command:
                - sh
                - -c
                - pg_isready -U "$POSTGRES_USER" -d elitebnb
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 6
          livenessProbe:
            exec:
              command:
                - sh
                - -c
                - pg_isready -U "$POSTGRES_USER" -d elitebnb
            initialDelaySeconds: 30
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 6
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
          volumeMounts:
            - name: postgres-data
              mountPath: /var/lib/postgresql/data
      volumes:
        - name: postgres-data
          persistentVolumeClaim:
            claimName: elitebnb-postgres-data
